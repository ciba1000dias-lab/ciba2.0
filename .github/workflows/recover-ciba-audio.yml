name: Build CIBA C7-04 podcast master
on:
  push:
    paths:
      - ".github/workflows/recover-ciba-audio.yml"
      - "scripts/build_ciba_c7_04_podcast.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CIBA
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install pydub
      - name: Download HeyGen voices, CIBA theme and sound effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://resource2.heygen.ai/text_to_speech/bb9c33b9a4f246bfaad6f76f0b2e5310/84854979e66846989bc6c5855f53268f/id=84a57742b8ae4018838605df9f44fed2.mp3' -o recovered/01-rocio.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://resource2.heygen.ai/text_to_speech/bb9c33b9a4f246bfaad6f76f0b2e5310/4b49e50e44c84e99b0f960da7d434e95/id=056beb8dddef4cd6a163540a5151bed7.mp3' -o recovered/02-yadira.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://resource2.heygen.ai/text_to_speech/bb9c33b9a4f246bfaad6f76f0b2e5310/70bc24b8126c446c8cf50fc1a01eb834/id=29249ececa014888bbcd6ed331f20211.mp3' -o recovered/03-emiliano.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://resource2.heygen.ai/text_to_speech/bb9c33b9a4f246bfaad6f76f0b2e5310/1777080b7f574979875dc144b9fbf0de/id=74da5d23df3e4c668688f547a29d65cb.mp3' -o recovered/04-montserrat.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://resource2.heygen.ai/audio/ff68a232daf54185bc772350d86a7580/original.mp3' -o recovered/05-ciba-theme.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://heygen-product.s3-accelerate.amazonaws.com/gen_os/sfx/f21dfc942d4165a2.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA3FLD4S3AS7WYJKBK%2F20261112%2Fus-east-2%2Fs3%2Faws4_request&X-Amz-Date=20261112T043401Z&X-Amz-Expires=604800&X-Amz-SignedHeaders=host&X-Amz-Signature=249adead12422f495c69105784275b4c576a505cc0132c8a2693893bf02fc19d' -o recovered/06-transition-whoosh.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://heygen-product.s3-accelerate.amazonaws.com/gen_os/sfx/d81327f4a910a146.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA3FLD4S3AS7WYJKBK%2F20261112%2Fus-east-2%2Fs3%2Faws4_request&X-Amz-Date=20261112T043423Z&X-Amz-Expires=604800&X-Amz-SignedHeaders=host&X-Amz-Signature=3f857678c53116ce7db07537d84def91a01d46950183e73723b9444954b9e7cb' -o recovered/07-small-objects.mp3
          curl -fL --retry 2 --connect-timeout 20 --max-time 180 'https://heygen-product.s3-accelerate.amazonaws.com/gen_os/sfx/9b77ef762e4f45f2.mp3?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=AKIA3FLD4S3AS7WYJKBK%2F20261112%2Fus-east-2%2Fs3%2Faws4_request&X-Amz-Date=20261112T043423Z&X-Amz-Expires=604800&X-Amz-SignedHeaders=host&X-Amz-Signature=e7520860da4944737b4e103f1bb148a50fb325ea439f3ec4f4feaa73365eab47' -o recovered/08-page-turn.mp3
          for f in recovered/*.mp3; do test -s "$f"; done
      - name: Assemble the single master MP3
        run: python scripts/build_ciba_c7_04_podcast.py
      - name: Commit master audio to CIBA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/c7-04-con-lo-que-tenemos.mp3
          git commit -m "Add CIBA C7-04 podcast master audio"
          git push
      - name: Save source and master audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciba-c7-04-master-and-sources
          path: |
            recovered/*.mp3
            assets/audio/c7-04-con-lo-que-tenemos.mp3
          if-no-files-found: error
          retention-days: 7
