
name: Build and deploy CIBA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Comprobar sintaxis JavaScript del sitio
        run: |
          node --input-type=module --check < assets/js/ciba-recetario-motor.js
          node --input-type=module --check < assets/js/ciba-recetario.js
          node --input-type=module --check < assets/js/ciba-global.js
          node --check assets/js/ciba-plataforma.js

      - name: Validar contenidos
        run: python scripts/validate_content.py --src content

      - name: Construir sitio
        run: python scripts/build_catalog.py --src content --out dist

      - name: Generar episodios completos Podcast CIBA C4-10 y C4-11
        run: |
          python -m pip install numpy imageio-ffmpeg mutagen
          python scripts/build_podcast_c4_10.py --out dist/c/C4/C4-10/podcast-c4-10.mp3
          python scripts/build_podcast_c4_11.py --out dist/c/C4/C4-11/podcast-c4-11.mp3

      - name: Preparar imágenes locales de la biblioteca
        run: python scripts/optimize_alimento_images.py --src dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar solamente dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
