
name: Build and deploy CIBA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramienta de imágenes
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Validar contenidos
        run: python scripts/validate_content.py --src content

      - name: Construir sitio
        run: python scripts/build_catalog.py --src content --out dist

      - name: Optimizar fotografías de la biblioteca a WebP
        run: python scripts/optimize_alimento_images.py --src dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar solamente dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
