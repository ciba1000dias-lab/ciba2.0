
name: Build and deploy CIBA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Comprobar sintaxis JavaScript del sitio
        run: |
          node --input-type=module --check < assets/js/ciba-recetario-motor.js
          node --input-type=module --check < assets/js/ciba-recetario.js
          node --input-type=module --check < assets/js/ciba-global.js
          node --check assets/js/ciba-plataforma.js

      - name: Validar contenidos
        run: python scripts/validate_content.py --src content

      - name: Construir sitio
        run: python scripts/build_catalog.py --src content --out dist

      - name: Incorporar el tríptico original de vacunación de Cuba
        run: |
          mkdir -p dist/assets/descargables
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://anondrop.io/whl3b5ct674x3646ibsa/Tr%C3%ADptico%20de%20vacunaci%C3%B3n%20de%20Cuba.pdf?download=true" \
            --output dist/assets/descargables/triptico-vacunacion-cuba.pdf
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("dist/assets/descargables/triptico-vacunacion-cuba.pdf")
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          expected = "455fc281fc17cc5d16cdc269917ab92bb47d600790285a494e429a4e0bce5397"
          assert len(data) == 8640272, f"Tamaño inesperado: {len(data)} bytes"
          assert data[:5] == b"%PDF-", "El archivo descargado no es un PDF"
          assert digest == expected, f"El PDF no coincide con el original: {digest}"
          print(f"Tríptico original verificado: {len(data):,} bytes · SHA-256 {digest}")
          PY

      - name: Restaurar podcasts CIBA C4-10, C4-11 y C4-12
        id: podcast-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/c/C4/C4-10/podcast-c4-10.mp3
            dist/c/C4/C4-11/podcast-c4-11.mp3
            dist/c/C4/C4-12/podcast-c4-12.mp3
          key: ciba-podcasts-v1-${{ runner.os }}-${{ hashFiles('scripts/build_podcast_c4_10.py', 'scripts/build_podcast_c4_11.py', 'scripts/build_podcast_c4_12.py') }}

      - name: Generar podcasts CIBA (solo si cambian sus scripts)
        if: steps.podcast-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install numpy imageio-ffmpeg mutagen
          python scripts/build_podcast_c4_10.py --out dist/c/C4/C4-10/podcast-c4-10.mp3
          python scripts/build_podcast_c4_11.py --out dist/c/C4/C4-11/podcast-c4-11.mp3
          python scripts/build_podcast_c4_12.py --out dist/c/C4/C4-12/podcast-c4-12.mp3

      - name: Verificar audio maestro CIBA C7-04
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("dist/assets/audio/c7-04-con-lo-que-tenemos.mp3")
          assert p.is_file() and p.stat().st_size > 100000, f"Audio maestro ausente o incompleto: {p}"
          with p.open("rb") as f:
              header = f.read(3)
          assert header == b"ID3" or header[0] == 0xFF, "El archivo no parece ser un MP3 válido"
          print(f"Audio maestro verificado: {p.stat().st_size:,} bytes")
          PY

      - name: Generar cartilla de vacunación en PDF A4 desde el SVG aprobado
        run: |
          python -m pip install CairoSVG
          python scripts/generate_cartilla_pdf.py --src assets/images/cartilla-vacunacion-interior.svg --out dist/assets/images/cartilla-vacunacion-interior.pdf

      - name: Preparar imágenes locales de la biblioteca
        run: python scripts/optimize_alimento_images.py --src dist

      - name: Auditar enlaces internos del sitio generado (diagnóstico inicial)
        run: >-
          python scripts/audit_internal_links.py
          --root dist
          --base-url https://ciba1000dias-lab.github.io/ciba2.0/
          --json-out /tmp/ciba-internal-links-audit.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar solamente dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4

# Reintento manual de publicación tras cancelación de ejecuciones anteriores.
