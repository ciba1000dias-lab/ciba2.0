<text x="32" y="917" font-family="Arial" font-size="9.5" font-weight="bold" fill="#B85C4A">SITUACIÓN ESPECIAL · HIJOS DE MADRES HBsAg POSITIVAS</text>
<text x="32" y="934" font-family="Arial" font-size="8" fill="#493A32">Hepatitis B al nacer, al mes, a los 2 meses y al año; BCG a los 3 meses; gammaglobulina;</text>
<text x="32" y="947" font-family="Arial" font-size="8" fill="#493A32">DTP y Hib a los 2, 4, 6 y 18 meses; resto de vacunas según esquema. Coordinar con el equipo de salud.</text>
<text x="32" y="969" font-family="Arial" font-size="7.5" font-weight="bold" fill="#344B3A">ID: intradérmica · IM: intramuscular · SC: subcutánea · React.: reactivación · FV: fecha de vencimiento</text>
<text x="32" y="1082" font-family="Arial" font-size="8" fill="#75695E">Registro complementario: no sustituye el carné oficial de salud infantil. Administración por personal sanitario.</text>
