<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="t d"><title id="t">Primero jugamos, después guardamos</title><desc id="d">Secuencia familiar de cuatro pasos para enseñar a recoger juguetes mediante juego compartido.</desc><rect width="1080" height="1350" fill="#f5f0e5"/><rect x="45" y="45" width="990" height="1260" rx="34" fill="#fffdf7" stroke="#e4ddcf" stroke-width="3"/><text x="95" y="135" font-family="Georgia,serif" font-size="31" letter-spacing="5" fill="#526e56">CIBA · CRECEMOS ACOMPAÑÁNDONOS</text><text x="95" y="230" font-family="Georgia,serif" font-size="66" fill="#172b27">Primero jugamos,</text><text x="95" y="305" font-family="Georgia,serif" font-size="66" fill="#172b27">después guardamos</text><text x="98" y="365" font-family="Arial,sans-serif" font-size="25" fill="#73776d">Una rutina breve, amable y adaptada a cada edad</text><g font-family="Arial,sans-serif"><rect x="95" y="435" width="890" height="155" rx="24" fill="#e8eee6"/><circle cx="180" cy="512" r="48" fill="#526e56"/><text x="180" y="528" font-size="43" text-anchor="middle" fill="#fffdf7">1</text><text x="260" y="493" font-size="34" font-weight="bold" fill="#172b27">JUGAMOS</text><text x="260" y="540" font-size="24" fill="#29332d">Disfrutamos y exploramos los juguetes.</text><rect x="95" y="625" width="890" height="155" rx="24" fill="#f2ead8"/><circle cx="180" cy="702" r="48" fill="#b38a45"/><text x="180" y="718" font-size="43" text-anchor="middle" fill="#fffdf7">2</text><text x="260" y="683" font-size="34" font-weight="bold" fill="#172b27">AVISAMOS</text><text x="260" y="730" font-size="24" fill="#29332d">Anticipamos que pronto terminaremos.</text><rect x="95" y="815" width="890" height="155" rx="24" fill="#e8eee6"/><circle cx="180" cy="892" r="48" fill="#526e56"/><text x="180" y="908" font-size="43" text-anchor="middle" fill="#fffdf7">3</text><text x="260" y="873" font-size="34" font-weight="bold" fill="#172b27">GUARDAMOS JUNTOS</text><text x="260" y="920" font-size="24" fill="#29332d">El adulto muestra y el niño participa.</text><rect x="95" y="1005" width="890" height="155" rx="24" fill="#f2ead8"/><circle cx="180" cy="1082" r="48" fill="#b38a45"/><text x="180" y="1098" font-size="43" text-anchor="middle" fill="#fffdf7">4</text><text x="260" y="1063" font-size="34" font-weight="bold" fill="#172b27">SEGUIMOS</text><text x="260" y="1110" font-size="24" fill="#29332d">Reconocemos el esfuerzo y pasamos a otra actividad.</text></g><text x="95" y="1225" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#526e56">No buscamos perfección: acompañamos pequeños aprendizajes.</text><text x="95" y="1265" font-family="Arial,sans-serif" font-size="19" fill="#73776d">Sigue a CIBA en su canal de WhatsApp</text></svg>